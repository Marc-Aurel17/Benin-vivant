<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Guides touristiques — Admin Bénin Vivant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* --- Palette : tissus appliqués royaux d'Abomey + patrimoine bâti --- */
  --nuit:#0e1119;
  --nuit-2:#141826;
  --panneau:#171d2c;
  --panneau-2:#1e2740;
  --bordure:rgba(236,226,204,.1);
  --or:#c99a2e;
  --or-clair:#e3bc5c;
  --rouge-vodun:#8c3a2c;
  --vert-patine:#3f6653;
  --parchemin:#ece2cc;
  --parchemin-att:#a7a08e;

  --serif:'Fraunces', serif;
  --sans:'Inter', sans-serif;
  --mono:'JetBrains Mono', monospace;

  --container: 1180px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--nuit);
  color:var(--parchemin);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
.wrap{max-width:var(--container); margin:0 auto; padding:0 2.5rem;}

/* ---------- motif signature : bandeau appliqué géométrique (Danxomè) ---------- */
.bandeau-motif{
  height:10px; width:100%;
  background:
    linear-gradient(135deg, var(--or) 25%, transparent 25%) -6px 0,
    linear-gradient(225deg, var(--or) 25%, transparent 25%) -6px 0,
    linear-gradient(315deg, var(--or) 25%, transparent 25%),
    linear-gradient(45deg, var(--or) 25%, transparent 25%);
  background-size:12px 12px;
  opacity:.8;
}

/* ---------- navigation ---------- */
header.site-nav{
  position:sticky; top:0; z-index:100;
  background:rgba(14,17,25,.9); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bordure);
}
.nav-inner{display:flex; align-items:center; justify-content:space-between; padding:1.3rem 0;}
.logo{font-family:var(--serif); font-size:1.25rem; font-weight:600;}
.logo span{color:var(--or);}
.nav-links{display:flex; align-items:center; gap:2.1rem; font-size:.9rem;}
.nav-links a{color:var(--parchemin-att); transition:color .2s;}
.nav-links a:hover, .nav-links a.active{color:var(--or-clair);}
.nav-cta{
  padding:.65rem 1.3rem; border:1px solid var(--or); border-radius:3px;
  color:var(--or-clair) !important; font-weight:500; font-size:.85rem;
}
.nav-cta:hover{background:var(--or); color:var(--nuit) !important;}

/* ---------- boutons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:.5rem;
  font-family:var(--sans); font-weight:500; font-size:.92rem;
  padding:.9rem 1.7rem; border-radius:3px; cursor:pointer; border:1px solid transparent;
  transition:transform .2s ease, background .2s ease, border-color .2s ease;
}
.btn-primary{background:var(--or); color:#241a05;}
.btn-primary:hover{background:var(--or-clair); transform:translateY(-2px);}
.btn-ghost{border-color:rgba(236,226,204,.3); color:var(--parchemin); background:transparent;}
.btn-ghost:hover{border-color:var(--or); color:var(--or-clair);}

/* ---------- eyebrow / labels ---------- */
.eyebrow{
  font-family:var(--mono); font-size:.74rem; letter-spacing:.13em; text-transform:uppercase;
  color:var(--or); display:flex; align-items:center; gap:.6rem; margin-bottom:1rem;
}
.eyebrow::before{content:''; width:20px; height:1px; background:var(--or);}
.eyebrow.alt{color:var(--vert-patine);}
.eyebrow.alt::before{background:var(--vert-patine);}

/* ---------- sections génériques ---------- */
section{padding:5.5rem 0;}
.section-head{max-width:640px; margin-bottom:3rem;}
.section-head h2{font-family:var(--serif); font-weight:500; font-size:2.2rem; color:var(--parchemin);}
.section-head p{color:var(--parchemin-att); margin-top:.9rem; font-size:1rem;}
.section-head.center{margin-left:auto; margin-right:auto; text-align:center;}

/* ---------- stats institutionnelles ---------- */
.stats-bar{
  display:grid; grid-template-columns:repeat(4,1fr);
  border:1px solid var(--bordure); border-radius:4px; overflow:hidden;
  background:var(--panneau);
}
.stat{padding:2rem 1.5rem; text-align:center; border-right:1px solid var(--bordure);}
.stat:last-child{border-right:none;}
.stat .num{font-family:var(--serif); font-size:2.3rem; color:var(--or-clair); font-weight:500;}
.stat .lbl{font-size:.82rem; color:var(--parchemin-att); margin-top:.3rem;}

/* ---------- cartes / grilles ---------- */
.card-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--bordure); border:1px solid var(--bordure);}
.card{background:var(--panneau); padding:2.1rem 1.7rem; transition:background .25s;}
.card:hover{background:var(--panneau-2);}
.card .num{font-family:var(--mono); font-size:.74rem; color:var(--or); display:block; margin-bottom:1rem;}
.card h3{font-family:var(--serif); font-size:1.12rem; font-weight:500; margin-bottom:.55rem;}
.card p{font-size:.87rem; color:var(--parchemin-att);}

/* ---------- fiches sites/ethnies (image + texte) ---------- */
.tile{background:var(--panneau); border:1px solid var(--bordure); border-radius:4px; overflow:hidden; transition:transform .25s, border-color .25s;}
.tile:hover{transform:translateY(-4px); border-color:rgba(201,154,46,.4);}
.tile-media{height:170px; position:relative; overflow:hidden;}
.tile-media svg{width:100%; height:100%;}
.tile-tag{
  position:absolute; top:.9rem; left:.9rem; background:rgba(14,17,25,.75);
  font-family:var(--mono); font-size:.68rem; padding:.3rem .6rem; border-radius:2px;
  color:var(--or-clair); letter-spacing:.05em; text-transform:uppercase;
}
.tile-body{padding:1.4rem 1.5rem;}
.tile-body h3{font-family:var(--serif); font-size:1.15rem; margin-bottom:.5rem;}
.tile-body p{font-size:.86rem; color:var(--parchemin-att); margin-bottom:1rem;}
.tile-meta{display:flex; justify-content:space-between; align-items:center; font-size:.78rem; color:var(--parchemin-att); font-family:var(--mono);}

/* ---------- frise chronologique ---------- */
.frise-wrap{overflow-x:auto; padding-bottom:.5rem;}
.frise{display:flex; min-width:920px; position:relative; padding-top:2.4rem;}
.frise::before{content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, var(--or) 8%, var(--or) 92%, transparent);}
.frise-item{flex:1; position:relative; padding:0 1.1rem;}
.frise-item::before{content:''; position:absolute; top:-2.4rem; left:1.1rem; width:9px; height:9px; border-radius:50%; background:var(--or);}
.frise-item .annee{font-family:var(--mono); font-size:.76rem; color:var(--or); display:block; margin-bottom:.4rem;}
.frise-item h4{font-family:var(--serif); font-size:1rem; margin-bottom:.35rem;}
.frise-item p{font-size:.8rem; color:var(--parchemin-att);}

/* ---------- citation / témoignage ---------- */
.quote-block{
  border-left:2px solid var(--or); padding-left:2rem; max-width:680px;
}
.quote-block p{font-family:var(--serif); font-size:1.35rem; font-style:italic; line-height:1.5; color:var(--parchemin);}
.quote-block .who{margin-top:1.2rem; font-family:var(--mono); font-size:.8rem; color:var(--parchemin-att);}

/* ---------- CTA bandeau ---------- */
.cta-band{
  background:var(--panneau-2); border:1px solid var(--bordure); border-radius:4px;
  padding:3.2rem 3rem; display:flex; align-items:center; justify-content:space-between; gap:2rem;
}
.cta-band h3{font-family:var(--serif); font-size:1.6rem; font-weight:500; max-width:26ch;}
.cta-actions{display:flex; gap:.9rem; flex-shrink:0;}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--bordure); padding:3.5rem 0 2rem;}
.footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:2.5rem; padding-bottom:2.5rem;}
.footer-grid h4{font-family:var(--serif); font-size:1rem; margin-bottom:1rem; color:var(--parchemin);}
.footer-grid p, .footer-grid a{font-size:.86rem; color:var(--parchemin-att); display:block; margin-bottom:.55rem;}
.footer-grid a:hover{color:var(--or-clair);}
.footer-bottom{
  border-top:1px solid var(--bordure); padding-top:1.5rem;
  display:flex; justify-content:space-between; font-size:.78rem; color:var(--parchemin-att); font-family:var(--mono);
}

/* ---------- utilitaires ---------- */
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:3.5rem; align-items:center;}
.badge{
  display:inline-block; font-family:var(--mono); font-size:.7rem; padding:.25rem .6rem;
  border:1px solid rgba(63,102,83,.4); color:var(--vert-patine); border-radius:2px; margin-bottom:.5rem;
}

@media (max-width:900px){
  .wrap{padding:0 1.4rem;}
  .stats-bar{grid-template-columns:repeat(2,1fr);}
  .card-grid{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr 1fr;}
  .cta-band{flex-direction:column; align-items:flex-start;}
}


/* ================= LAYOUT ADMIN ================= */
.admin-shell{display:grid; grid-template-columns:250px 1fr; min-height:100vh;}
.admin-sidebar{
  background:var(--panneau); border-right:1px solid var(--bordure);
  padding:1.6rem 1.2rem; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.admin-sidebar .logo{margin-bottom:2.2rem; display:block; padding:0 .6rem;}
.admin-nav-group{margin-bottom:1.6rem;}
.admin-nav-label{
  font-family:var(--mono); font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--parchemin-att); padding:0 .6rem; margin-bottom:.6rem; display:block;
}
.admin-nav a{
  display:flex; align-items:center; gap:.7rem; padding:.55rem .6rem; border-radius:4px;
  font-size:.87rem; color:var(--parchemin-att); margin-bottom:.15rem; transition:all .15s;
}
.admin-nav a:hover{background:var(--panneau-2); color:var(--parchemin);}
.admin-nav a.active{background:rgba(201,154,46,.12); color:var(--or-clair);}
.admin-nav a svg{flex-shrink:0; opacity:.85;}
.admin-nav .badge-count{
  margin-left:auto; background:var(--rouge-vodun); color:var(--parchemin);
  font-family:var(--mono); font-size:.68rem; padding:.05rem .4rem; border-radius:10px;
}

.admin-main{padding:2.2rem 2.6rem; max-width:1180px;}
.admin-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:2.2rem;}
.admin-topbar h1{font-family:var(--serif); font-size:1.7rem; font-weight:500;}
.admin-search{
  display:flex; align-items:center; gap:.6rem; background:var(--panneau);
  border:1px solid var(--bordure); border-radius:4px; padding:.6rem 1rem; width:320px;
}
.admin-search input{background:none; border:none; outline:none; color:var(--parchemin); font-size:.86rem; width:100%;}
.admin-user{display:flex; align-items:center; gap:.7rem; font-size:.85rem;}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--or); display:flex; align-items:center; justify-content:center; font-family:var(--serif); color:#241a05; font-weight:600;}

.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1.1rem; margin-bottom:2.5rem;}
.kpi-card{background:var(--panneau); border:1px solid var(--bordure); border-radius:5px; padding:1.4rem 1.5rem;}
.kpi-card .kpi-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1rem;}
.kpi-card .num{font-family:var(--serif); font-size:2rem; color:var(--parchemin);}
.kpi-card .lbl{font-size:.8rem; color:var(--parchemin-att); margin-top:.2rem;}
.kpi-card.alert .num{color:var(--rouge-vodun);}
.kpi-icon{width:34px; height:34px; border-radius:5px; display:flex; align-items:center; justify-content:center; background:rgba(201,154,46,.12);}

.panel{background:var(--panneau); border:1px solid var(--bordure); border-radius:5px; margin-bottom:1.8rem;}
.panel-head{display:flex; justify-content:space-between; align-items:center; padding:1.2rem 1.5rem; border-bottom:1px solid var(--bordure);}
.panel-head h2{font-family:var(--serif); font-size:1.1rem; font-weight:500;}
.panel-body{padding:.4rem 0;}

table.admin-table{width:100%; border-collapse:collapse; font-size:.86rem;}
table.admin-table th{text-align:left; padding:.7rem 1.5rem; font-family:var(--mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--parchemin-att); border-bottom:1px solid var(--bordure);}
table.admin-table td{padding:.85rem 1.5rem; border-bottom:1px solid var(--bordure); color:var(--parchemin);}
table.admin-table tr:last-child td{border-bottom:none;}
.status-pill{font-family:var(--mono); font-size:.7rem; padding:.2rem .6rem; border-radius:10px; display:inline-block;}
.status-pill.attente{background:rgba(201,154,46,.15); color:var(--or-clair);}
.status-pill.ok{background:rgba(63,102,83,.2); color:#7fb89c;}
.status-pill.alerte{background:rgba(140,58,42,.2); color:#e08a75;}
.row-action{font-family:var(--mono); font-size:.76rem; color:var(--or-clair); cursor:pointer;}
.row-action + .row-action{margin-left:1rem; color:var(--parchemin-att);}

/* ================= SUPER ADMIN — THÈME ================= */
.settings-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:2rem; align-items:start;}
.form-group{margin-bottom:1.4rem;}
.form-group label{display:block; font-size:.83rem; color:var(--parchemin-att); margin-bottom:.5rem;}
.form-group input[type=text], .form-group input[type=email], .form-group input[type=number], .form-group textarea, .form-group select{
  width:100%; background:var(--nuit-2); border:1px solid var(--bordure); border-radius:4px;
  padding:.75rem .9rem; color:var(--parchemin); font-family:var(--sans); font-size:.9rem; outline:none;
  transition:border-color .2s;
}
.form-group input:focus, .form-group textarea:focus{border-color:var(--or);}
.form-group textarea{resize:vertical; min-height:80px;}
.color-row{display:flex; align-items:center; gap:.8rem;}
.color-swatch-input{width:44px; height:38px; border-radius:4px; border:1px solid var(--bordure); background:none; cursor:pointer; padding:2px;}
.form-row-2{display:grid; grid-template-columns:1fr 1fr; gap:1rem;}
.super-badge{
  display:inline-flex; align-items:center; gap:.5rem; font-family:var(--mono); font-size:.72rem;
  color:var(--or-clair); border:1px solid rgba(201,154,46,.35); padding:.3rem .7rem; border-radius:3px; margin-bottom:1.2rem;
}
.preview-frame{
  background:var(--nuit); border:1px solid var(--bordure); border-radius:5px; padding:1.8rem;
  position:sticky; top:1.5rem;
}
.preview-frame .mini-hero{padding:1.2rem 0;}
.preview-frame .mini-hero .eyebrow{font-size:.66rem;}
.preview-frame .mini-hero h3{font-size:1.3rem;}
.preview-label{font-family:var(--mono); font-size:.7rem; color:var(--parchemin-att); text-transform:uppercase; letter-spacing:.08em; margin-bottom:1rem;}

@media (max-width:1000px){
  .admin-shell{grid-template-columns:1fr;}
  .admin-sidebar{display:none;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .settings-grid{grid-template-columns:1fr;}
}
</style>
  <link rel="stylesheet" href="assets/css/theme-benin-vivant.css">
  <script src="assets/js/theme-toggle.js"></script>
<link rel="stylesheet" href="assets/css/bv-responsive.css">
<script src="assets/js/bv-responsive.js" defer></script>
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="bv-admin-sidebar"></aside>
  <main class="admin-main">
    <div class="admin-topbar"><h1>Guides touristiques</h1><div class="admin-user"></div></div>
    <div class="panel"><div class="panel-body">
      <table class="admin-table">
        <thead><tr><th>Nom</th><th>Spécialité</th><th>Zone</th><th>Langues</th><th>Statut</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6">Chargement...</td></tr></tbody>
      </table>
    </div></div>

    <div class="panel">
      <div class="panel-head"><h2>Demandes de contact reçues (tous guides)</h2></div>
      <div class="panel-body">
        <table class="admin-table">
          <thead><tr><th>Guide</th><th>Visiteur</th><th>Contact</th><th>Message</th><th>Statut</th><th>Date</th></tr></thead>
          <tbody id="tbodyDemandes"><tr><td colspan="6">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="assets/js/env.js"></script>
<script src="assets/js/bv-api.js"></script>
<script src="assets/js/admin-guard.js"></script>
<script>
const STATUT_LABEL = { en_attente: 'En attente', valide: 'Validé', suspendu: 'Suspendu' };
const STATUT_CLASSE = { en_attente: 'attente', valide: 'ok', suspendu: 'alerte' };

async function charger() {
  const guides = await BeninVivantAPI.adminGuidesList();
  document.getElementById('tbody').innerHTML = guides.length ? guides.map(g => `
    <tr>
      <td>${g.prenom} ${g.nom}<br><span style="color:var(--parchemin-att); font-size:.76rem;">${g.email}</span></td>
      <td>${g.specialite || '—'}</td>
      <td>${g.zone_couverte || '—'}</td>
      <td>${g.langues_parlees || '—'}</td>
      <td><span class="status-pill ${STATUT_CLASSE[g.statut]}">${STATUT_LABEL[g.statut]}</span></td>
      <td>
        ${g.statut !== 'valide' ? `<span class="row-action" onclick="changer(${g.id},'valide')">Valider</span>` : ''}
        ${g.statut !== 'suspendu' ? `<span class="row-action" onclick="changer(${g.id},'suspendu')">Suspendre</span>` : `<span class="row-action" onclick="changer(${g.id},'valide')">Réactiver</span>`}
      </td>
    </tr>`).join('') : '<tr><td colspan="6" style="color:var(--parchemin-att);">Aucun guide inscrit.</td></tr>';

  const demandes = await BeninVivantAPI.adminDemandesContactGuides();
  const STATUT_DEMANDE = { nouveau: ['alerte', 'Nouveau'], lu: ['attente', 'Lu'], traite: ['ok', 'Traité'] };
  document.getElementById('tbodyDemandes').innerHTML = demandes.length ? demandes.map(d => `
    <tr>
      <td>${d.guide_prenom} ${d.guide_nom}</td>
      <td>${d.visiteur_nom}</td>
      <td style="font-size:.8rem;">${d.visiteur_email}${d.visiteur_telephone ? '<br>' + d.visiteur_telephone : ''}</td>
      <td style="max-width:280px; font-size:.82rem;">${d.message}</td>
      <td><span class="status-pill ${STATUT_DEMANDE[d.statut][0]}">${STATUT_DEMANDE[d.statut][1]}</span></td>
      <td style="font-family:var(--mono); font-size:.76rem;">${(d.created_at || '').substring(0, 10)}</td>
    </tr>`).join('') : '<tr><td colspan="6" style="color:var(--parchemin-att);">Aucune demande reçue.</td></tr>';
}
async function changer(id, statut) { await BeninVivantAPI.adminGuidesProcess(id, statut); charger(); }
gardeAdmin().then(u => { if (u) charger(); });
</script>
<script src="assets/js/pwa-register.js" defer></script>

</body></html>
